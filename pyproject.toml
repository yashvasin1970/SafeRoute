[project]
name = "saferoute"
version = "0.1.0"
description = "Real-time evacuation routing around blocked roads (SIH 2026, DM03)."
requires-python = ">=3.11"
dependencies = ["flask>=3.0", "networkx>=3.2", "python-dotenv>=1.0"]

[project.optional-dependencies]
osm = ["osmnx>=2.0"]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001"]  # the ✕ and – characters in user-facing text are intentional
