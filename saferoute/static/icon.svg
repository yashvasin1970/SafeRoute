<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="SafeRoute">
  <defs>
    <linearGradient id="sr-g" x1="6" y1="3" x2="26" y2="29" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#1535b4"/>
    </linearGradient>
  </defs>
  <!-- Shield = Safe -->
  <path d="M16 2.6 26.4 6.1 V15.6 C26.4 22.4 22 26.8 16 29.4 C10 26.8 5.6 22.4 5.6 15.6 V6.1 Z" fill="url(#sr-g)"/>
  <!-- Route = Route: a path winding up to the destination -->
  <path d="M11.6 23 C11.6 19.4 14.6 18.4 16 16.2 C17.4 14 16.3 11.6 20.4 10.2" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="11.6" cy="23" r="2.4" fill="#ffffff"/>
  <!-- Destination pin -->
  <circle cx="20.4" cy="10.2" r="3.4" fill="#ffffff"/>
  <circle cx="20.4" cy="10.2" r="1.5" fill="#1535b4"/>
</svg>
